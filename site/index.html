<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="结构化写作 Claude 插件：按金字塔原理起草、审阅、重构中文职场文档。">
    <title>结构化写作 · structured-writing</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./config.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="./">structured-writing</a>
        <a class="source-link" id="github-link" href="https://github.com/guishiru/structured-writing">查看 GitHub</a>
      </header>

      <section class="download-panel" aria-labelledby="page-title">
        <p class="eyebrow">Claude 插件 · MIT License</p>
        <h1 id="page-title">结构化写作</h1>
        <p class="lede">把职场文档搭成结论先行、以上统下、归类分组、逻辑递进的金字塔。</p>
        <div class="actions">
          <a class="button button-primary" id="download-button" href="https://github.com/guishiru/structured-writing/releases/latest/download/structured-writing.plugin">
            下载 .plugin
          </a>
          <a class="button button-secondary" id="release-link" href="https://github.com/guishiru/structured-writing/releases/latest">
            查看版本
          </a>
        </div>
        <p class="release-note" id="release-note">正在读取最新版本信息...</p>
      </section>

      <section class="feature-grid" aria-label="插件能力">
        <article>
          <span class="feature-index">01</span>
          <h2>写</h2>
          <p>先问清目标和读者，搭好中心思想、关键句与序言，再展开成稿。</p>
        </article>
        <article>
          <span class="feature-index">02</span>
          <h2>审</h2>
          <p>诊断结论、分组、序言、标题、层级和数据自洽，不擅自改写原文。</p>
        </article>
        <article>
          <span class="feature-index">03</span>
          <h2>改</h2>
          <p>重搭结构，保留你的语气，给出改动说明和改前改后对照。</p>
        </article>
      </section>

      <footer class="footer">
        <span id="stats-note">开源项目 · 数据统计仅在配置统计接口后启用</span>
        <a href="https://github.com/guishiru/structured-writing/blob/main/README.md">阅读说明</a>
      </footer>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
